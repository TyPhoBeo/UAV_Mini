; Project PlatformIO ở GỐC repo — mở thẳng UAV-S3/ bằng PlatformIO IDE là
; build/upload/monitor được ngay, không cần thư mục con nào khác. Build thẳng
; component components/flight_core/ THẬT (không phải bản copy) qua ESP-IDF
; component search mặc định (components/ + main/ cạnh platformio.ini).
;
; src/main.c là firmware điều khiển THẬT (console USB, arm/takeoff/land/...,
; xem README.md mục "Bay qua console USB") — KHÔNG cần build MicroPython port
; riêng để bay, mục đó trong README chỉ còn optional.
[env:esp32s3_flight_core_verify]
platform = espressif32
; 4D Systems GEN4-ESP32 16MB (ESP32S3-R8N16) — board JSON khớp ĐÚNG chip thật
; trên miniUav (N16R8: 16MB flash, 8MB octal PSRAM), mặc định flash_size=16MB/
; maximum_size=16777216 sẵn -> KHÔNG cần override tay board_upload.* như bản
; devkitc-1 cũ (JSON đó mặc định N8/8MB).
board = 4d_systems_esp32s3_gen4_r8n16
framework = espidf

; ---- Bang phan vung: 4MB cho app (truoc day 1MB) ----
; PHAI khai o DAY, khong phai trong sdkconfig. PlatformIO BO QUA
; CONFIG_PARTITION_TABLE_* cua sdkconfig cho viec chon bang: builder cua no
; (platforms/espressif32/builder/frameworks/espidf.py) doc thang
; board.get("build.partitions", "partitions_singleapp.csv"). Sua sdkconfig
; xong build lai van ra bang 1M cu, IM LANG - da thu va kiem chung.
;
; Bang mac dinh partitions_singleapp.csv hardcode "factory = 1M" trong khi
; chip la N16R8 (16MB that): 15MB bo khong, con app cham tran 93.3%.
; partitions.csv (goc repo) giu nguyen nvs @0x9000/24K + phy_init @0xf000/4K
; -> du lieu NVS dang co (bias gyro da calib, namespace "fc_calib") KHONG mat.
;
; Nap KHONG doi gi: PlatformIO von luon nap ca bootloader @0x0 + bang @0x8000
; + app @0x10000 moi lan upload. Van giu BOOT + RESET nhu cu.
board_build.partitions = partitions.csv

monitor_speed = 115200
upload_speed = 115200
; miniUav KHÔNG có USB-UART bridge chip — nạp code + monitor qua USB D+/D-
; (native USB-Serial-JTAG, IO19/20). KHÔNG có auto-reset qua DTR/RTS -> PHẢI
; giữ nút BOOT (GPIO0 LOW) rồi nhấn/thả RESET để vào download-mode THỦ CÔNG
; trước khi `pio run -t upload` (xem README.md mục "Console / nạp code").
; Nếu auto-detect cổng COM thất bại, mở khóa 2 dòng dưới và điền đúng cổng:
; upload_port = COM5
; monitor_port = COM5
monitor_filters = esp32_exception_decoder

; Không bật PSRAM ở firmware này (flight_core + console không cần buffer lớn
; nào dùng PSRAM). PSRAM (octal, N16R8) là việc của sdkconfig bên project
; MicroPython port (nếu sau này build, xem README.md mục "Build MicroPython
; port thật") — bật nửa vời ở đây (build_flags -D CONFIG_SPIRAM=1 chẳng hạn)
; không thật sự cấu hình lại sdkconfig toàn framework, dễ gây lỗi build không
; liên quan tới flight_core. CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG=y +
; CONFIG_USJ_ENABLE_USB_SERIAL_JTAG=y đã có sẵn trong
; sdkconfig.esp32s3_flight_core_verify (console/nạp code qua D+/D-, không qua
; UART0) — không cần thêm gì nữa.

; ---- Camera OV2640 ----
; Driver CHINH THUC cua Espressif, keo ve bang IDF component manager theo
; components/uav_camera/idf_component.yml -- KHONG dung lib_deps.
;
; Ly do: esp32-camera khai esp_jpeg la dependency PUBLIC, va esp_camera.h
; include img_converters.h -> jpeg_decoder.h. lib_deps cua PlatformIO chi keo
; duoc dung repo minh ghi, khong doc duoc dependency long nhau -> build chet o
; "jpeg_decoder.h: No such file". Da thu va kiem chung.
;
; Component manager KHONG co san trong penv cua PlatformIO. Cai mot lan:
;     ~/.platformio/penv/Scripts/pip install "idf-component-manager>=1.4,<2"
